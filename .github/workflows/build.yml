name: Build and Release APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Missing KEYSTORE_B64 secret. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/tablet.jks"

      - name: Create project
        run: |
          mkdir -p app/src/main/java/com/waguri/tablettile app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TabletTile"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.waguri.tablettile'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.waguri.tablettile'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  stable {
                      storeFile file("${rootDir}/tablet.jks")
                      storePassword 'tabletpass123'
                      keyAlias 'tablettile'
                      keyPassword 'tabletpass123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Tablet UI"
                  android:icon="@drawable/ic_tile">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.DeviceDefault.Light">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE_PREFERENCES" />
                      </intent-filter>
                  </activity>
                  <activity-alias
                      android:name=".Launcher"
                      android:targetActivity=".MainActivity"
                      android:exported="true"
                      android:label="Tablet UI"
                      android:icon="@drawable/ic_tile">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>
                  <service
                      android:name=".TabletTileService"
                      android:exported="true"
                      android:label="Tablet UI"
                      android:icon="@drawable/ic_tile"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_tile.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#3DDC84"
                  android:pathData="M19,3L5,3c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2L21,5c0,-1.1 -0.9,-2 -2,-2zM12,20c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM19,17L5,17L5,5h14v12z" />
          </vector>
          EOF

          cat > app/src/main/java/com/waguri/tablettile/TabletTileService.java <<'EOF'
          package com.waguri.tablettile;

          import android.graphics.drawable.Icon;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;

          public class TabletTileService extends TileService {
              // sw400 = 432 dpi on 1080px wide, sw652 = 265 dpi
              static final int TABLET_DPI = 265;
              static final int NORMAL_DPI = 432;

              private boolean isTablet() {
                  return getResources().getConfiguration().smallestScreenWidthDp >= 600;
              }

              private void render(boolean tablet) {
                  Tile t = getQsTile();
                  if (t == null) return;
                  t.setLabel("Tablet UI");
                  t.setIcon(Icon.createWithResource(this, R.drawable.ic_tile));
                  t.setState(tablet ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                  t.updateTile();
              }

              @Override
              public void onStartListening() {
                  render(isTablet());
              }

              @Override
              public void onClick() {
                  final boolean goTablet = !isTablet();
                  final int dpi = goTablet ? TABLET_DPI : NORMAL_DPI;
                  render(goTablet);
                  new Thread(() -> {
                      try {
                          Process p = Runtime.getRuntime().exec(
                                  new String[]{"su", "-c", "wm density " + dpi});
                          p.waitFor();
                      } catch (Exception ignored) {
                      }
                  }).start();
              }
          }
          EOF

          cat > app/src/main/java/com/waguri/tablettile/MainActivity.java <<'EOF'
          package com.waguri.tablettile;

          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private Button hideBtn;

              private ComponentName alias() {
                  return new ComponentName(this, "com.waguri.tablettile.Launcher");
              }

              private boolean iconShown() {
                  return getPackageManager().getComponentEnabledSetting(alias())
                          != PackageManager.COMPONENT_ENABLED_STATE_DISABLED;
              }

              private void refreshButton() {
                  hideBtn.setText(iconShown() ? "Hide launcher icon" : "Show launcher icon");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(48, 96, 48, 48);

                  final TextView info = new TextView(this);
                  info.setTextSize(16);
                  info.setText("1. Tap Grant root and allow it in KernelSU.\n"
                          + "2. Add the 'Tablet UI' tile in Quick Settings.\n"
                          + "3. Hide the icon if you like. Long-press the tile to open this screen again.");
                  root.addView(info);

                  Button b = new Button(this);
                  b.setText("Grant root");
                  b.setOnClickListener(v -> new Thread(() -> {
                      String result;
                      try {
                          Process p = Runtime.getRuntime().exec(new String[]{"su", "-c", "id"});
                          result = p.waitFor() == 0 ? "Root OK" : "Root denied";
                      } catch (Exception e) {
                          result = "No root: " + e.getMessage();
                      }
                      final String r = result;
                      runOnUiThread(() -> info.setText(r));
                  }).start());
                  root.addView(b);

                  hideBtn = new Button(this);
                  hideBtn.setOnClickListener(v -> {
                      int state = iconShown()
                              ? PackageManager.COMPONENT_ENABLED_STATE_DISABLED
                              : PackageManager.COMPONENT_ENABLED_STATE_ENABLED;
                      getPackageManager().setComponentEnabledSetting(
                              alias(), state, PackageManager.DONT_KILL_APP);
                      refreshButton();
                  });
                  root.addView(hideBtn);
                  refreshButton();

                  setContentView(root);
              }
          }
          EOF

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TabletUI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TabletTile-apk
          path: TabletUI.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" TabletUI.apk \
            --repo "${{ github.repository }}" \
            --title "Tablet UI build ${{ github.run_number }}" \
            --notes "Automated build from commit ${{ github.sha }}."
